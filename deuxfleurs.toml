[[cors]]
allowed_origins = "*"
allowed_methods = ["GET", "POST"]
allowed_headers = "*"

[[headers]]
for = ["**/*.woff2", "**/*.woff", "**/*.svg", "**/*.ttf", "**/*.otf", "**/*.eot", "**/*.js", "**/*.css"]
compress = "gzip"
[headers.values]
Cache-Control = "max-age=31536000, no-transform, public"

[[headers]]
for = ["**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.gif", "**/*.webp"]
[headers.values]
Cache-Control = "max-age=31536000, no-transform, public"

[[redirects]]
from = "/organisations/"
to = "/archives/organisations/"

[[redirects]]
from = "/personnes/equipe-editoriale/"
to = "/archives/personnes/equipe-editoriale/"

[[redirects]]
from = "/realisations/2026-parquet-2026/"
to = "/realisations/2025-parquet/"

[[redirects]]
from = "/parquet/"
to = "/prestations/parquet/"

[[redirects]]
from = "/projets/"
to = "/realisations/"

[[redirects]]
from = "/realisations/2025-parquet-2026/"
to = "/realisations/2025-parquet/"

[[redirects]]
from = "/personnes/"
to = "/archives/personnes/equipe-editoriale/"

[[redirects]]
from = "/realisations/agencement/"
to = "/realisations/agencement-sur-mesure/"

